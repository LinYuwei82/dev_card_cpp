<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="DevCard 应用图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E4B52"/>
      <stop offset="1" stop-color="#083238"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="232" y="204" width="560" height="616" rx="64"/>
    </clipPath>
  </defs>

  <!-- 底板：macOS squircle 安全区（824×824）内收 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- 卡片主体 -->
  <rect x="232" y="204" width="560" height="616" rx="64" fill="#FCFAF5"/>
  <g clip-path="url(#card)">
    <!-- 顶部铜色识别带：与界面强调色同源 -->
    <rect x="232" y="204" width="560" height="72" fill="#C07A45"/>
    <!-- 2×2 窗格：设备/楼栋语义，16px 下仍是四个点 -->
    <rect x="300" y="336" width="140" height="140" rx="20" fill="#12646B"/>
    <rect x="484" y="336" width="140" height="140" rx="20" fill="#12646B"/>
    <rect x="300" y="520" width="140" height="140" rx="20" fill="#12646B"/>
    <rect x="484" y="520" width="140" height="140" rx="20" fill="#12646B"/>
    <!-- 两行文字占位条，暗示「设备名称 / 位置」 -->
    <rect x="300" y="704" width="324" height="26" rx="13" fill="#C9D3D2"/>
    <rect x="300" y="750" width="216" height="26" rx="13" fill="#DCE3E2"/>
  </g>
</svg>
