<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设备台账 · 设备管理卡</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">DC</span>
      <span class="brand-text"><strong>设备管理卡</strong><small>DevCard</small></span>
    </div>
    <nav class="nav">
      <a class="nav-item is-active" href="/">设备台账</a>
      <a class="nav-item is-disabled" href="#" aria-disabled="true">用户管理</a>
      <a class="nav-item is-disabled" href="#" aria-disabled="true">卡片打印</a>
    </nav>
    <div class="sidebar-foot">M1 · 台账闭环<br><span id="health">连接中…</span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>设备台账</h1>
        <p>维护设备名称、位置、控制范围与维护电话</p>
      </div>
      <div class="topbar-actions">
        <span class="pill" id="version-pill">—</span>
      </div>
    </header>

    <section class="page">
      <div class="toolbar">
        <form class="filters" id="filters">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input id="keyword" type="search" placeholder="搜索名称、位置、电话" autocomplete="off">
          </label>
          <select id="field" aria-label="搜索字段">
            <option value="">全部字段</option>
            <option value="dev_name">设备名称</option>
            <option value="location">位置</option>
            <option value="control_range">控制范围</option>
            <option value="phone">维护电话</option>
          </select>
          <select id="name" aria-label="按名称筛选"><option value="">全部名称</option></select>
          <select id="location" aria-label="按位置筛选"><option value="">全部位置</option></select>
          <button class="btn btn-primary" type="submit">查询</button>
          <button class="btn btn-ghost" type="button" id="reset">重置</button>
        </form>
        <button class="btn btn-ghost" type="button" id="import-btn">导入</button>
        <button class="btn btn-ghost" type="button" id="export-btn">导出</button>
        <input type="file" id="import-file" accept=".xlsx" hidden />
        <button class="btn btn-primary" id="add">新增设备</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
          <tr>
            <th class="col-id">编号</th>
            <th>设备名称</th>
            <th>位置</th>
            <th>控制范围</th>
            <th>维护电话</th>
            <th class="col-actions">操作</th>
          </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>没有匹配的设备，换个筛选条件或新增一条。</div>
      </div>

      <footer class="pager">
        <span>共 <strong id="total">0</strong> 条</span>
        <span id="page-label">第 1 / 1 页</span>
        <div class="pager-buttons">
          <button class="btn btn-ghost" id="prev" type="button">上一页</button>
          <button class="btn btn-ghost" id="next" type="button">下一页</button>
        </div>
      </footer>
    </section>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header class="drawer-head">
    <div>
      <h2 id="drawer-title">新增设备</h2>
      <p>四个字段均必填，单字段不超过 20 个字符。</p>
    </div>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="关闭">×</button>
  </header>
  <form class="drawer-form" id="device-form">
    <input type="hidden" id="device-id">
    <label>设备名称<input id="dev-name" maxlength="20" required></label>
    <label>位置<input id="dev-location" maxlength="20" required></label>
    <label>控制范围<input id="dev-range" maxlength="20" required></label>
    <label>维护电话<input id="dev-phone" maxlength="20" required></label>
    <p class="form-error" id="form-error" hidden></p>
    <div class="drawer-actions">
      <button class="btn btn-ghost" type="button" id="drawer-cancel">取消</button>
      <button class="btn btn-primary" type="submit" id="drawer-save">保存</button>
    </div>
  </form>
</aside>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">删除设备</h2>
    <p id="modal-text">确定删除这条设备记录？删除后不可恢复。</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-delete" type="button">取消</button>
      <button class="btn btn-danger" id="confirm-delete" type="button">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
