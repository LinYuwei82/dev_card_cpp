<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设备管理卡 · 新架构</title>
  <style>
    :root { --ink:#0B3A40; --teal:#12646B; --paper:#F5F3EE; --line:#E4DFD5; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:var(--paper); color:#1B2426;
           font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei UI",system-ui,sans-serif; }
    main { width:min(560px, calc(100% - 48px)); background:#fff; border:1px solid var(--line);
           border-radius:14px; padding:36px; box-shadow:0 16px 40px rgba(20,35,35,.08); }
    .mark { width:44px; height:44px; border-radius:10px; background:var(--ink);
            display:grid; place-items:center; color:#fff; font-weight:700; margin-bottom:20px; }
    h1 { margin:0 0 8px; font-size:22px; letter-spacing:.01em; }
    p { margin:0 0 20px; color:#5C696B; }
    code { font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
    .row { display:flex; gap:10px; align-items:center; padding:12px 14px;
           background:#FAF9F5; border:1px solid var(--line); border-radius:10px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#2E6B4F; }
    .muted { color:#8B9698; font-size:13px; margin-top:18px; }
  </style>
</head>
<body>
<main>
  <div class="mark">DC</div>
  <h1>新架构骨架已启动</h1>
  <p>这是 M0 的内嵌页面，用来验证「单进程 HTTP 服务 + 系统 WebView」链路，不含业务功能。</p>
  <div class="row"><span class="dot"></span><span>后端：<code id="health">检查中…</code></span></div>
  <div class="muted">Qt 版代码未改动；旧版仍可独立构建运行。</div>
</main>
<script>
  fetch('/api/health').then(r => r.json()).then(d => {
    document.getElementById('health').textContent =
      `ok · version ${d.version} · schema ${d.schema_version} · ${d.mode}`;
  }).catch(() => {
    document.getElementById('health').textContent = '无法连接后端';
  });
</script>
</body>
</html>
