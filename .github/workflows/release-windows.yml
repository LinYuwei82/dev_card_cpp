name: Windows 发布

# 手动触发的 Windows 发布流水线：构建 → guard 门禁 → 上传 OSS（清单含 notes_url）
# → 线上校验 → 创建 GitHub / Gitee Release（dry_run 跳过上传与 Release）。
# Windows 机器不再需要 OSS 凭据与发布环境，任何能打开 GitHub 的电脑都能发版。
# 前置 secrets：OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（仅授予 PutObject）、
# DEVCARD_UPDATE_SIGNING_KEY、GITEE_TOKEN（Gitee releases + 附件上传权限）。
#
# 注意：发布前先确认 VERSION.txt 是要比线上更新的版本；guard 会拒绝版本回退，
# 且安装包是 immutable 长缓存，同名覆盖不会生效。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: 更新说明（写进 manifest.json，可留空）
        required: false
        default: ""
      build:
        description: "手动构建号（正式发布请用 tag v<semver>+<seq>）"
        required: false
        default: ""
      dry_run:
        description: 只出包与清单，不上传 OSS
        type: boolean
        default: false

permissions:
  contents: write   # 创建/更新 GitHub Release 需要写权限（Gitee 走 GITEE_TOKEN）

# Windows 英文 runner 默认 cp1252，Python 打印中文会崩；统一 UTF-8 输出
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: 构建 → 门禁 → 上传
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # guard 是三仓库共用的单一规则源（见 mote/docs/OSS-发布布局.md）
      # Windows 检出可能把哈希文件转成 CRLF，先去掉 \r 再校验
      - name: 校验 guard / manifest_v2 未被单独改动
        shell: bash
        run: |
          tr -d '\r' < tools/release/guard.sha256 | sha256sum -c -
          tr -d '\r' < tools/release/manifest_v2.sha256 | sha256sum -c -
      - name: guard / manifest_v2 selftest
        shell: pwsh
        run: |
          python tools/release/guard.py selftest
          python tools/release/manifest_v2.py selftest

      # 桌面壳依赖 WebView2 SDK（不入库）：固定版本 + 幂等下载，失败即失败
      - name: 取 WebView2 SDK
        shell: pwsh
        run: ./shell/win/fetch-webview2.ps1

      - name: 生成构建号（tag v<semver>+<seq> 或手动）
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $parsed = python tools\release\release_tag.py parse --ensure-latest --tag $env:GITHUB_REF_NAME --emit sh
            if ($LASTEXITCODE -ne 0) { throw "tag 解析失败：$env:GITHUB_REF_NAME" }
            foreach ($line in $parsed) {
              $kv = $line -split '=', 2
              if ($kv.Count -eq 2) { Set-Item -Path "Env:$($kv[0])" -Value $kv[1] }
            }
            echo "DEVCARD_BUILD=$env:BUILD" | Out-File -Encoding utf8 $env:GITHUB_ENV
            Write-Host "构建号来自 tag：$env:GITHUB_REF_NAME → $env:BUILD"
          } else {
            $b = '${{ inputs.build }}'
            if (-not $b) { throw '手动触发必须提供 build 参数；正式发布请用 tag v<semver>+<seq>' }
            echo "DEVCARD_BUILD=$b" | Out-File -Encoding utf8 $env:GITHUB_ENV
            Write-Host "构建号：$b（手动）"
          }
      - name: 校验版本 / 构建号递增
        shell: pwsh
        run: |
          python tools\release\check_version_bump.py --product devcard --build $env:DEVCARD_BUILD `
            --platform windows `
            --manifest-url "https://dl.xiaotu.online/devcard/updates/stable/manifest.json"
          if ($LASTEXITCODE -ne 0) { throw '版本/构建号递增校验失败' }

      # Ninja 不自带工具链定位能力，先由 msvc-dev-cmd 注入 x64 MSVC 环境（cl/ninja 进 PATH）。
      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 配置
        run: cmake --preset windows-release -DDEVCARD_BUILD=${{ env.DEVCARD_BUILD }}

      # 只构建生产 target，跳过 tests 项目。
      # 原因：tests/test_api_contract.cpp 在 Windows SDK 10.0.26100 上因 ws2tcpip.h
      # 结构体条件编译差异会编译失败，但生产二进制(devcard-server + DevCard)不受影响。
      - name: 构建
        run: cmake --build --preset windows-release --parallel --target devcard-server DevCard

      - name: 发布（打绿色包/安装包 → manifest.json v2 → guard → 上传）
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-hongkong.aliyuncs.com
          OSS_BUCKET: xiaotu-update
          DEVCARD_UPDATE_SIGNING_KEY: ${{ secrets.DEVCARD_UPDATE_SIGNING_KEY }}
          DEVCARD_NOTES: ${{ inputs.notes }}
        run: |
          # 显式命名参数：数组 splat 传 -Switch 不可靠，容易静默丢失（dry-run 变成真发布）
          $dry = '${{ inputs.dry_run }}' -eq 'true'
          ./tools/release/publish_windows.ps1 -SkipBuild -Notes $env:DEVCARD_NOTES -DryRun:$dry -Build $env:DEVCARD_BUILD

      # 与 OSS 发布同一版本：GitHub 用工作流 token，Gitee 用 secret GITEE_TOKEN。
      # macOS dmg 若已在 OSS（本地未留档）会自动回源；单平台发版时缺的附件跳过。
      - name: 创建 GitHub / Gitee Release
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REQUIRE_GITEE: "true"
          ALLOW_MISSING_ATTACHMENTS: "true"
          SKIP_TAG_PUSH: "true"
        run: bash tools/release/publish_release.sh

      - name: 上传构建产物（留档）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DevCard-windows-release
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/manifest.json
          if-no-files-found: warn
          retention-days: 14
