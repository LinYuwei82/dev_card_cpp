name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guard:
    name: 发布门禁自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 三仓库共用同一份 guard.py（见 mote/docs/OSS-发布布局.md），
      # 改坏规则时在 PR 阶段就失败，而不是等发布。
      - name: 校验 guard 未被单独改动
        run: sha256sum -c tools/release/guard.sha256
      - name: guard selftest
        run: python3 tools/release/guard.py selftest

  windows-build:
    name: Windows 构建
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 桌面壳依赖 WebView2 SDK（不入库），先按固定版本 + SHA256 取一次；
      # 失败即失败，不降级跳过——否则「配置能过、壳编不了」会拖到发版才暴露。
      - name: 取 WebView2 SDK
        shell: pwsh
        run: ./shell/win/fetch-webview2.ps1

      # 显式指定 x64：WebView2 SDK 的静态库只有 x64，不能让生成器自己挑。
      - name: 配置
        run: cmake -S . -B build-win -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build-win --config Release --parallel

      # 5 条：core / web_assets / no_opposans / embed_web / api_contract。
      # -C Release 对 VS 多配置生成器必填。
      - name: 测试
        run: ctest --test-dir build-win -C Release --output-on-failure

      # 产物与本地同一条路径：版本/内容自检不过就直接失败。
      - name: 打绿色包
        shell: pwsh
        run: ./tools/package/package_windows.ps1 -SkipBuild -BuildDir build-win -OutDir dist

      # 安装包也走脚本：避免手写 digest/size。更新清单由 release-windows 工作流生成。
      # windows-latest 通常自带 Inno Setup 6，找不到时用 choco 补装。
      - name: 打安装包
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "找不到 Inno Setup 6（ISCC.exe）"; exit 1 }

          $stage = Join-Path $env:RUNNER_TEMP "devcard-installer"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "fonts") | Out-Null
          Copy-Item -LiteralPath "build-win/shell/win/Release/DevCard.exe" -Destination $stage
          Copy-Item -LiteralPath "build-win/server/Release/devcard-server.exe" -Destination $stage
          Copy-Item -LiteralPath "web/fonts/NotoSansSC-Regular.subset.ttf" -Destination (Join-Path $stage "fonts")
          Copy-Item -LiteralPath "web/fonts/NotoSansSC-Bold.subset.ttf" -Destination (Join-Path $stage "fonts")

          & $iscc "/DSourceRoot=$stage" "packaging/windows/DevCard.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: DevCard-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            build-win/server/Release/devcard-server.exe
            build-win/shell/win/Release/DevCard.exe
          if-no-files-found: error
          retention-days: 14

  macos-build:
    name: macOS 构建
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 构建
        run: cmake --build build --config Release --parallel

      # -C Release 对单配置生成器是空操作，保留是为了两个 job 命令一致。
      - name: 测试
        run: ctest --test-dir build -C Release --output-on-failure
