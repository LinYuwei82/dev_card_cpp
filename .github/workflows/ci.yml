name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guard:
    name: 发布门禁自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 三仓库共用同一份 guard.py（见 mote/docs/OSS-发布布局.md），
      # 改坏规则时在 PR 阶段就失败，而不是等发布。
      - name: 校验 guard 未被单独改动
        run: sha256sum -c tools/release/guard.sha256
      - name: guard selftest
        run: python3 tools/release/guard.py selftest
      - name: 发布脚本布局检查
        run: python3 tools/release/test_release_layout.py
      - name: 发布/门禁单元测试
        run: |
          for t in test_release_tag test_version_bump test_guard test_guard_manifest test_publish_release; do
            python3 tools/release/$t.py
          done

  windows-build:
    name: Windows 构建
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 桌面壳依赖 WebView2 SDK（不入库），先按固定版本 + SHA256 取一次；
      # 失败即失败，不降级跳过——否则「配置能过、壳编不了」会拖到发版才暴露。
      - name: 取 WebView2 SDK
        shell: pwsh
        run: ./shell/win/fetch-webview2.ps1

      # Ninja 不自带工具链定位能力，先由 msvc-dev-cmd 注入 x64 MSVC 环境（cl/ninja 进 PATH）。
      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 配置
        run: cmake --preset windows-release

      - name: 构建
        run: cmake --build build/windows --parallel

      # 5 条：core / web_assets / no_opposans / embed_web / api_contract。
      # Ninja 是单配置生成器，不再依赖 -C Release。
      - name: 测试
        run: ctest --test-dir build/windows --output-on-failure

      # 产物与本地同一条路径：版本/内容自检不过就直接失败。
      - name: 打绿色包
        shell: pwsh
        run: ./tools/package/package_windows.ps1 -SkipBuild -BuildDir build/windows -OutDir dist

      # 安装包也走脚本：避免手写 digest/size。更新清单由 release-windows 工作流生成。
      # windows-latest 通常自带 Inno Setup 6，找不到时用 choco 补装。
      - name: 打安装包
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "找不到 Inno Setup 6（ISCC.exe）"; exit 1 }

          $stage = Join-Path $env:RUNNER_TEMP "devcard-installer"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "fonts") | Out-Null
          Copy-Item -LiteralPath "build/windows/shell/win/DevCard.exe" -Destination $stage
          Copy-Item -LiteralPath "build/windows/server/devcard-server.exe" -Destination $stage
          Copy-Item -LiteralPath "web/fonts/NotoSansSC-Regular.subset.ttf" -Destination (Join-Path $stage "fonts")
          Copy-Item -LiteralPath "web/fonts/NotoSansSC-Bold.subset.ttf" -Destination (Join-Path $stage "fonts")

          & $iscc "/DSourceRoot=$stage" "packaging/windows/DevCard.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: DevCard-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            build/windows/server/devcard-server.exe
            build/windows/shell/win/DevCard.exe
          if-no-files-found: error
          retention-days: 14

  macos-build:
    name: macOS 构建
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 配置
        run: cmake --preset macos-release

      - name: 构建
        run: cmake --build build/release --parallel

      # Ninja 是单配置生成器，-C 已删除。
      - name: 测试
        run: ctest --test-dir build/release --output-on-failure
